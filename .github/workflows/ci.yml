name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main, so something rotting (a dependency, the registry, a tool) shows before a session hits it.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The same check sessions start and end on: tools, install, repo, typecheck, tests, site build.
      - run: pnpm health

      # A red nightly is something wrong, so it's an issue: one, kept open until it's fixed.
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly health check failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "bug" });
            const existing = open.find((i) => i.title === title);
            const body = `\`pnpm health\` failed on main: ${run}\n\nRun \`pnpm health\` in a session to reproduce; the failing check prints its command and a hint.`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ["bug"] });
