name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The studio page shows open PRs and bugs, so it's rebuilt when one opens or closes.
  # pull_request_target checks out main, never the PR's code, so it's safe with write access.
  pull_request_target:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  deploy:
    # A merged PR is also a push to main, which deploys anyway.
    if: github.event_name != 'pull_request_target' || !github.event.pull_request.merged
    # The site's own queue: GitHub keeps one pending run per group and cancels the older, so a shared
    # group let a PR's preview cancel main's deploy (#47). Here only a newer site build can replace a
    # pending one. On the job, so a skipped run never takes a place in the queue.
    concurrency:
      group: gh-pages-site
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
        env:
          STUDIO_GITHUB: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          clean-exclude: |
            preview/pr-*/
          # Previews push to gh-pages at the same time: rebase onto them, never overwrite them.
          force: false
          attempt-limit: 10
