name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The studio page shows open PRs and bugs, so it's rebuilt when one opens or closes.
  # pull_request_target checks out main, never the PR's code, so it's safe with write access.
  pull_request_target:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

# Main and PR previews all push to gh-pages; queue them instead of racing.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
        env:
          STUDIO_GITHUB: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          clean-exclude: |
            preview/pr-*/
