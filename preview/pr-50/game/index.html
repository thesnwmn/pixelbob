<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#121014" />
    <title>Pixelbob</title>
    <script type="module" crossorigin src="./assets/index-186n9hNw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BSOMXH8L.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="note"></div>
      <div id="bar">
        <button id="cardbtn" title="The handoff card (H)" hidden>Card</button>
        <button id="feedbackbtn" title="Feedback (F)">Feedback</button>
        <button id="back" title="Back to the last checkpoint (R)">Checkpoint</button>
        <button id="restart" title="Back to the start, with a new replay">Restart</button>
        <button id="pause" title="Pause (P)">Pause</button>
        <button id="fs" title="Full screen">⛶</button>
      </div>
      <div id="touch"><span>◀ drag ▶ · ▼ pour · ▲ climb</span><span>tap: jump</span></div>
    </div>

    <div id="card" class="sheet" hidden>
      <div class="box">
        <h2 id="cardtitle"></h2>
        <p id="changed"></p>
        <section id="trysec"><h3>Try</h3><ul id="try"></ul></section>
        <section id="looksec"><h3>Look for</h3><ul id="lookfor"></ul></section>
        <section id="knownsec"><h3>Known issues</h3><ul id="known"></ul></section>
        <div class="buttons"><button id="play" class="primary">Play</button></div>
      </div>
    </div>

    <div id="feedback" class="sheet" hidden>
      <form class="box" id="form">
        <h2>Feedback</h2>
        <p class="meta" id="fbmeta"></p>
        <fieldset><legend>Fun</legend><div class="scale" data-name="fun"></div></fieldset>
        <fieldset>
          <legend>Difficulty</legend>
          <div class="scale">
            <label><input type="radio" name="difficulty" value="too-easy" />too easy</label>
            <label><input type="radio" name="difficulty" value="right" />right</label>
            <label><input type="radio" name="difficulty" value="too-hard" />too hard</label>
          </div>
        </fieldset>
        <fieldset><legend>Frustration</legend><div class="scale" data-name="frustration"></div></fieldset>
        <div id="questions"></div>
        <label class="text">What happened, what you liked, what felt off<textarea id="notes" rows="4"></textarea></label>
        <textarea id="out" rows="8" readonly hidden></textarea>
        <p id="copied" class="meta"></p>
        <div class="buttons"><button type="button" id="close">Close</button><button type="submit" class="primary">Copy report</button></div>
      </form>
    </div>

    <div id="error" class="sheet" hidden><div class="box"></div></div>
  </body>
</html>
